<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            left: 0;
        }
        #map_6caa1b953fab4a9fbd71e7b64b820206 {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .leaflet-container {
            font-size: 1rem;
        }

        .modal-backdrop {
            z-index: 1000; 
        }
        .modal {
            z-index: 1050;
        }
    </style>
</head>
<body>
    
    <div class="modal fade" id="infoModal" tabindex="-1" aria-labelledby="infoModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="infoModalLabel">Welcome</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Para el correcto funcionamiento con el generador de mapas para FIVE, se debe seleccionar primero la ESQUINA SUPERIOR IZQUIERDA y luego la ESQUINA INFERIOR DERECHA. Al hacer click en el mapa se copian las coordenadas automáticamente al portapapeles</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <div id="map_6caa1b953fab4a9fbd71e7b64b820206"></div>

    <script>
        $(document).ready(function() {
            $('#infoModal').modal('show'); 
        });

        var map_6caa1b953fab4a9fbd71e7b64b820206 = L.map("map_6caa1b953fab4a9fbd71e7b64b820206", {
            center: [39.4699, -0.3763],
            crs: L.CRS.EPSG3857,
            zoom: 8,
            zoomControl: true,
            preferCanvas: false,
        });

        var tile_layer_5d87b9441cf8aa7da1147abd569ac060 = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution: "Data by &copy; <a target='_blank' href='http://openstreetmap.org'>OpenStreetMap</a>, under <a target='_blank' href='http://www.openstreetmap.org/copyright'>ODbL</a>.",
                detectRetina: false,
                maxNativeZoom: 18,
                maxZoom: 18,
                minZoom: 0,
                noWrap: false,
                opacity: 1,
                subdomains: "abc",
                tms: false
            }
        );

        tile_layer_5d87b9441cf8aa7da1147abd569ac060.addTo(map_6caa1b953fab4a9fbd71e7b64b820206);

        var tile_layer_b279763ece49162f78b5977538ed9493 = L.tileLayer(
            "https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",
            {
                attribution: "Google",
                detectRetina: false,
                maxNativeZoom: 20,
                maxZoom: 20,
                minZoom: 0,
                noWrap: false,
                opacity: 1,
                subdomains: ["mt0", "mt1", "mt2", "mt3"],
                tms: false
            }
        );

        tile_layer_b279763ece49162f78b5977538ed9493.addTo(map_6caa1b953fab4a9fbd71e7b64b820206);

        var lat_lng_popup_c1e9677de77987e9584d2bcf7b7832f4 = L.popup();

        function latLngPop(e) {
            lat_lng_popup_c1e9677de77987e9584d2bcf7b7832f4
                .setLatLng(e.latlng)
                .setContent("Latitude: " + e.latlng.lat.toFixed(4) + "<br>Longitude: " + e.latlng.lng.toFixed(4))
                .openOn(map_6caa1b953fab4a9fbd71e7b64b820206);
        }

        map_6caa1b953fab4a9fbd71e7b64b820206.on('click', latLngPop);

        function getLatLng(e) {
            var lat = e.latlng.lat.toFixed(6),
                lng = e.latlng.lng.toFixed(6);
            var txt = lat + ", " + lng;
            navigator.clipboard.writeText(txt);
        };

        map_6caa1b953fab4a9fbd71e7b64b820206.on('click', getLatLng);
    </script>
</body>
</html>
